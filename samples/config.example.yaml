# Kafka Stress Test Configuration File

# Kafka broker seed list
brokers:
  - "localhost:9092"

# Destination topic
topic: "stress-test-topic"

# Test Execution Parameters
total_messages: 100000   # 0 = unlimited
duration: 30s            # 0 = run until total_messages or Ctrl+C
rate_limit: 0            # messages per second (0 = unlimited maximum throughput)
workers: 20              # concurrent goroutines producing messages

# Kafka Producer Reliability & Performance
acks: "1"                # "all", "1", or "0"
compression: "snappy"    # "none", "snappy", "gzip", "lz4", "zstd"

# Message Key Strategy
key_mode: "uuid"         # "none" (round-robin partitions), "uuid", "counter", "fixed"
fixed_key: "default-key" # used only if key_mode is "fixed"

# Payload Strategy
# "random-json": Generates dynamic random JSON events
# "file": Reads payload from file (static or with dynamic {{uuid}}, {{counter}}, {{timestamp}} tokens)
payload_mode: "random-json"
file_path: "./samples/message_templated.json"
random_json_size: 0      # extra payload padding in bytes (optional)

# TLS / SSL Settings
tls_enabled: false                # enable TLS/SSL encryption
tls_ca_file: ""                   # path to CA certificate (PEM) to verify broker
tls_cert_file: ""                 # path to client certificate (PEM) for mTLS
tls_key_file: ""                  # path to client private key (PEM) for mTLS
tls_insecure_skip_verify: false   # skip broker certificate validation (useful for testing with self-signed certs)
tls_server_name: ""               # optional SNI hostname override

# Reporting
report_interval: 1s      # live progress update interval
prometheus_port: 0       # HTTP port to expose Prometheus metrics on /metrics (0 = disabled)
pushgateway_url: ""      # Prometheus Pushgateway URL (e.g., "http://localhost:9091", "" = disabled)
pushgateway_job: "kafka_stress_test" # Job name for Pushgateway
dry_run: false           # simulate generation without network/broker load
